---

secrets:
  plex-claim:
    file: ./secrets/plex-claim.secret

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  overseerr:
    # Plex/Overseerr is disabled by default in docker-compose.yml.
    image: sctx/overseerr:1.34.0
    container_name: overseerr
    restart: always
    logging: *default-logging
    env_file: ./env/plex.env
    volumes:
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/overseerr:/app/config
    healthcheck:
      test: wget http://localhost:5055/api/v1/status -qO /dev/null || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=false
    depends_on:
      plex:
        condition: service_healthy
        restart: true

  plex:
    # Plex is disabled by default in this Jellyfin-focused fork.
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: always
    logging: *default-logging
    secrets:
      - plex-claim
    env_file: ./env/plex.env
    volumes:
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/plex:/config
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/data:/data
    healthcheck:
      test: curl -f http://localhost:32400/identity || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=false

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

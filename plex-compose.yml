---

secrets:
  plex-claim:
    file: ./secrets/plex-claim.secret

services:
  overseerr:
    # Plex/Overseerr is disabled by default in docker-compose.yml.
    image: sctx/overseerr:latest
    container_name: overseerr
    restart: always
    env_file: ./env/plex.env
    volumes:
      - overseerr:/app/config
    healthcheck:
      test: wget http://localhost:5055/api/v1/status -qO /dev/null || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=false
    depends_on:
      plex:
        condition: service_healthy
        restart: true

  plex:
    # Plex is disabled by default in this Jellyfin-focused fork.
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: always
    secrets:
      - plex-claim
    env_file: ./env/plex.env
    volumes:
      - plex:/config
      - media:/media
    healthcheck:
      test: curl -f http://localhost:32400/identity || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=false

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

volumes:
  media: # Media library.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_STACK_ROOT:-D:/MediaStack}/data/media

  overseerr: # Overseerr app data.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/overseerr

  plex: # Plex app data.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/plex

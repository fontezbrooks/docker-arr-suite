---

secrets:
  cloudflare-token:
    file: ./secrets/cloudflare-token.secret
  cloudflare-email:
    file: ./secrets/cloudflare-email.secret
  openvpn_user:
    file: ./secrets/openvpn_user.secret
  openvpn_password:
    file: ./secrets/openvpn_password.secret

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: always
    logging: *default-logging
    command:
      - --log.level=INFO
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --api.dashboard=false
      # Set up LetsEncrypt certificate resolver with Cloudflare DNS challenge.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.delayBeforeChecks=20s
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL_ADDRESS}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # HTTP -> HTTPS redirect.
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # TLS configuration for the public websecure listener.
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
    secrets:
      - cloudflare-token
      - cloudflare-email
    env_file: ./env/traefik.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker-managed volume: Traefik requires acme.json at mode 0600, which
      # host bind mounts (especially Windows drives) cannot reliably provide.
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      start_period: 60s

  gluetun:
    # See more: https://github.com/qdm12/gluetun-wiki
    # This stack uses Linux containers. On Windows Server, run Docker with a
    # Linux backend such as WSL2 or a Linux VM; native Windows containers will
    # not run these images.
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    restart: always
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    secrets:
      - openvpn_user
      - openvpn_password
    env_file: ./env/gluetun.env
    # Admin apps that share Gluetun's network namespace are bound to localhost
    # only. Use SSH tunneling, a private VPN, or change these bindings if you
    # later want LAN access.
    ports:
      - "127.0.0.1:8088:8088"  # qBittorrent
      - "127.0.0.1:8989:8989"  # Sonarr
      - "127.0.0.1:7878:7878"  # Radarr
      - "127.0.0.1:9696:9696"  # Prowlarr
    volumes:
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/gluetun:/gluetun

  watchtower:
    # See more: https://github.com/containrrr/watchtower
    # Label-gated: only containers carrying
    # com.centurylinklabs.watchtower.enable=true are auto-updated. Everything
    # else is updated manually with `docker compose pull && docker compose up -d`
    # so pinned infrastructure images never change unattended.
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: always
    logging: *default-logging
    env_file: ./env/watchtower.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

include:
  - bittorrent-compose.yml
  - arr-compose.yml
  # Plex is intentionally disabled for this fork.
  # - plex-compose.yml
  - jellyseerr-compose.yml

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

volumes:
  letsencrypt:  # Traefik Lets Encrypt certs (Docker-managed, mode-sensitive).

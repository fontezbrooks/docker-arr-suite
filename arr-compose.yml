---

secrets:
  radarr-api:
    file: ./secrets/radarr-api.secret
  sonarr-api:
    file: ./secrets/sonarr-api.secret

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Every service mounts the same ${MEDIA_STACK_ROOT}/data tree at /data so that
# qBittorrent, Sonarr, Radarr, and Unpackerr all report identical paths.
# Without this, imports fail and hardlinks/atomic moves degrade to slow copies.
x-data-volume: &data-volume
  ${MEDIA_STACK_ROOT:-D:/MediaStack}/data:/data

services:
  sonarr:
    # See more: https://docs.linuxserver.io/images/docker-sonarr
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: always
    logging: *default-logging
    network_mode: service:gluetun
    env_file: ./env/arr.env
    volumes:
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/sonarr:/config
      - *data-volume
    healthcheck:
      test: curl -f http://localhost:8989/ping || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=false
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  radarr:
    # See more: https://docs.linuxserver.io/images/docker-radarr
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: always
    logging: *default-logging
    network_mode: service:gluetun
    env_file: ./env/arr.env
    volumes:
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/radarr:/config
      - *data-volume
    healthcheck:
      test: curl -f http://localhost:7878/ping || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=false
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  prowlarr:
    # See more: https://docs.linuxserver.io/images/docker-prowlarr
    # Prowlarr feeds indexers to Sonarr/Radarr, so it must not depend on them.
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: always
    logging: *default-logging
    network_mode: service:gluetun
    env_file: ./env/arr.env
    volumes:
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/prowlarr:/config
    healthcheck:
      test: curl -f http://localhost:9696/ping || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=false
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  unpackerr:
    # See more: https://unpackerr.zip/docs/install/compose
    # Reaches Sonarr/Radarr through the Gluetun network namespace and retries
    # on its own, so it only needs Gluetun to be up.
    image: golift/unpackerr:0.14
    container_name: unpackerr
    restart: always
    logging: *default-logging
    secrets:
      - radarr-api
      - sonarr-api
    env_file: ./env/arr.env
    volumes:
      - *data-volume
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/unpackerr:/config
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

---

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  bittorrent:
    # See more: https://docs.linuxserver.io/images/docker-qbittorrent
    # Mounts the same /data tree as the *arr apps. Set the qBittorrent
    # default save path to /data/torrents in the Web UI.
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: bittorrent
    restart: always
    logging: *default-logging
    network_mode: service:gluetun
    env_file: ./env/bittorrent.env
    volumes:
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/config/qbittorrent:/config
      - ${MEDIA_STACK_ROOT:-D:/MediaStack}/data:/data
    healthcheck:
      test: curl -f http://localhost:8088 || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      - traefik.enable=false
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  bittorrent_port_forwarder:
    # See more: https://github.com/mjmeli/qbittorrent-port-forward-gluetun-server
    # Disabled by default. Enable only after choosing a VPN provider that
    # supports port forwarding, then start it with:
    #   docker compose --profile portforward up -d
    # This image reads QBT_USERNAME/QBT_PASSWORD from the environment, so the
    # credentials live in env/bittorrent.env, not in secrets/.
    image: mjmeli/qbittorrent-port-forward-gluetun-server
    container_name: bittorrent_port_forwarder
    restart: always
    logging: *default-logging
    profiles:
      - portforward
    env_file: ./env/bittorrent.env
    depends_on:
      bittorrent:
        condition: service_healthy
        restart: true

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

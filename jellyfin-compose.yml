---

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: always
    user: 1000:1000
    # Bound to localhost only. For LAN access, change to "8096:8096".
    # For remote private access, prefer a VPN/Tailscale/Cloudflare Tunnel later.
    ports:
      - 127.0.0.1:8096:8096
    volumes:
      - jellyfin:/config
      - cache:/cache
      - media:/media
    env_file: ./env/jellyfin.env
    labels:
      - traefik.enable=false
    healthcheck:
      test: curl -f http://localhost:8096/health || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    depends_on:
      traefik:
        condition: service_healthy
        restart: true

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: always
    env_file: ./env/jellyfin.env
    volumes:
      - jellyseerr:/app/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${DOMAIN}`)
      - traefik.http.routers.jellyseerr.entrypoints=websecure
      - traefik.http.services.jellyseerr.loadbalancer.server.port=5055
    healthcheck:
      test: wget http://localhost:5055/api/v1/status -qO /dev/null || exit 1
      interval: 10s
      timeout: 3s
      start_period: 60s
    depends_on:
      traefik:
        condition: service_healthy
        restart: true
      jellyfin:
        condition: service_healthy
        restart: true

networks:
  default:
    name: media_network
    driver: bridge
    attachable: true

volumes:
  media: # Media library.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_STACK_ROOT:-/srv/media-stack}/data/media

  jellyseerr: # Jellyseerr app data.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_STACK_ROOT:-/srv/media-stack}/config/jellyseerr

  jellyfin: # Jellyfin app data.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_STACK_ROOT:-/srv/media-stack}/config/jellyfin

  cache: # Jellyfin cache data.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MEDIA_STACK_ROOT:-/srv/media-stack}/config/jellyfin-cache
